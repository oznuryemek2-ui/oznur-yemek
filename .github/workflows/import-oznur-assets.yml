name: Import Öznur site assets

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-oznur-assets.yml"

permissions:
  contents: write

jobs:
  import-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Download final site imagery
        run: |
          set -euo pipefail
          mkdir -p public/images/site
          curl -fL --retry 3 "https://at.adobe.com/qGE8AzebIAIbUyPj" -o public/images/site/hero-production.png
          curl -fL --retry 3 "https://at.adobe.com/9OTmrKCqRkr5tVmv" -o public/images/site/service-onsite.png
          curl -fL --retry 3 "https://at.adobe.com/KsLNziSdxIuAPgPi" -o public/images/site/service-delivery.png
          curl -fL --retry 3 "https://at.adobe.com/d3Dk71E63c0I4BiZ" -o public/images/site/service-pack.png
          curl -fL --retry 3 "https://at.adobe.com/Y4uxOoarJYpT3klp" -o public/images/site/quality-control.png
          curl -fL --retry 3 "https://at.adobe.com/GtXytt4is7iSHFeW" -o public/images/site/canteen-service.png
          curl -fL --retry 3 "https://at.adobe.com/nz4aIvCzsdUpsTvd" -o public/images/site/menu-meals.png
          curl -fL --retry 3 "https://at.adobe.com/PSH9Tb7rZByKZYE4" -o public/images/site/logo-mark.png
          file public/images/site/*.png
      - name: Commit assets
        run: |
          git config user.name "Öznur Site Bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/images/site
          git commit -m "Add final Öznur catering imagery and official logo" || exit 0
          git push origin main
