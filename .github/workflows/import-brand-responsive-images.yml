name: Import branded responsive images

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-brand-responsive-images.yml"

permissions:
  contents: write

jobs:
  import-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Download branded responsive images
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/images/site/brand-responsive

          get() {
            curl --fail --location --retry 3 --retry-delay 2 "$1" -o "public/images/site/brand-responsive/$2"
            test -s "public/images/site/brand-responsive/$2"
            bytes=$(stat -c%s "public/images/site/brand-responsive/$2")
            if [ "$bytes" -lt 50000 ]; then
              echo "Image too small: $2 ($bytes bytes)"
              exit 1
            fi
          }

          get "https://at.adobe.com/2LhNbHSlyOFPuLi1" "hero-cooking-desktop.webp"
          get "https://at.adobe.com/CErFYrOCQYntAaOE" "hero-cooking-mobile.webp"
          get "https://at.adobe.com/e6hdFjI5zzO2JgkE" "hero-delivery-desktop.webp"
          get "https://at.adobe.com/rhewkZvKa1d5RClj" "hero-delivery-mobile.webp"
          get "https://at.adobe.com/dUzG55Rx3OWAQOOC" "hero-event-desktop.webp"
          get "https://at.adobe.com/GxNQIxdJRwAACS4F" "hero-event-mobile.webp"
          get "https://at.adobe.com/JvlHZ21AlgPIarjz" "hero-iftar-desktop.webp"
          get "https://at.adobe.com/RjiZITa4PEBeCxA7" "hero-iftar-mobile.webp"
          get "https://at.adobe.com/UDHYqotXeaxF3rrC" "services-hero-desktop.webp"
          get "https://at.adobe.com/aCgebvzEnRDyZCec" "services-hero-mobile.webp"
          get "https://at.adobe.com/msLfuIhEDZLEDV52" "service-onsite-desktop.webp"
          get "https://at.adobe.com/yuWxf3g2QeDPQ8DF" "service-onsite-mobile.webp"
          get "https://at.adobe.com/wZEBvSHnekzTWLKf" "service-delivery-desktop.webp"
          get "https://at.adobe.com/GxC3MuLkSfBKmSZe" "service-delivery-mobile.webp"
          get "https://at.adobe.com/4mS8HdhUNWJgTU8G" "service-packaging-desktop.webp"
          get "https://at.adobe.com/7vfCe6d9o7AXreIY" "service-packaging-mobile.webp"
          get "https://at.adobe.com/cmBoaiAvxF8wtxUP" "service-event-desktop.webp"
          get "https://at.adobe.com/2br5F6SEGwCJsjRB" "service-event-mobile.webp"
          get "https://at.adobe.com/yrFsVXolGs6nS8gO" "service-iftar-desktop.webp"
          get "https://at.adobe.com/r3WBoo8F4skuQ6fN" "service-iftar-mobile.webp"

      - name: Commit images
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/site/brand-responsive
          if git diff --cached --quiet; then
            echo "No image changes."
            exit 0
          fi
          git commit -m "Add branded responsive site photography"
          git push origin HEAD:main
